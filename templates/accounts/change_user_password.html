{% extends "core/base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-white shadow rounded-lg p-6">
  <h1 class="text-2xl font-bold mb-4">تغيير كلمة مرور: {{ the_user.username }}</h1>
  <form method="post">
    {% csrf_token %}
    <label>كلمة المرور الجديدة</label>
    <input type="password" name="new_password" class="w-full border-gray-300 rounded px-3 py-2" />
    <label class="mt-2">تأكيد كلمة المرور</label>
    <input type="password" name="confirm_password" class="w-full border-gray-300 rounded px-3 py-2" />
    <div class="mt-4">
      <button class="bg-blue-600 text-white px-4 py-2 rounded">حفظ</button>
      <a href="{% url 'accounts:manage_staff' %}" class="ml-2 text-gray-600">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
