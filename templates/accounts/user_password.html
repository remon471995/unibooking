{% extends "base.html" %}
{% block title %}تغيير كلمة مرور {{ user_obj.username }}{% endblock %}
{% block content %}
<h1 class="text-xl mb-4">تغيير كلمة المرور: {{ user_obj.username }}</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div>
    <button class="px-4 py-2 bg-blue-600 text-white rounded">حفظ</button>
    <a class="px-4 py-2 bg-gray-200 rounded" href="{% url 'accounts:manage_users' %}">إلغاء</a>
  </div>
</form>
{% endblock %}
