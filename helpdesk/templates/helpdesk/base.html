<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UniBooking Helpdesk{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>

    <script>
        tailwind.config = {
            darkMode: 'media', // أو 'class' لو عندك زرار تحويل
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen flex flex-col">

    {% include "helpdesk/_topbar.html" %}

    {% if messages %}
        <div class="fixed top-4 left-4 z-50 flex flex-col gap-2 w-80">
            {% for message in messages %}
            <div class="p-4 rounded-lg shadow-lg text-sm text-white 
                {% if message.tags == 'error' %}bg-red-600{% else %}bg-green-600{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="flex-grow container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-auto py-6 text-center text-sm text-gray-500 border-t dark:border-gray-800">
        &copy; {% now "Y" %} UniBooking Helpdesk System
    </footer>

    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
</body>
</html>
